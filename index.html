  --ink: #23303A; --ink2: #5A6772; --line: #E6E0DA; --paper: #F7F4F1; --card: #FFFFFF;
  --ok: #1D7A55; --warn: #8A5A00; --bad: #A82A1E;
  --serif: 'Cormorant Garamond', 'Playfair Display', Georgia, 'Times New Roman', serif;
  --sans: 'Jost', 'Century Gothic', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-family: var(--sans); font-size: 15px; line-height: 1.4; color: var(--ink); background: var(--paper); min-height: 100vh; color-scheme: light;
  -webkit-text-size-adjust: 100%; position: relative;
}
body.ab-lock { overflow: hidden; }
body.ab-dragging, body.ab-dragging * { cursor: grabbing !important; user-select: none; }
.ab button, .ab input, .ab select, .ab textarea { font: inherit; color: inherit; }
.ab button { cursor: pointer; }
.ab h1, .ab h2, .ab h3, .ab h4 { font-family: var(--serif); font-weight: 600; margin: 0; letter-spacing: .01em; line-height: 1.15; }
.ab h3 { font-size: 1.35rem; } .ab h4 { font-size: 1.1rem; }
.ab :focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; border-radius: 6px; }
.ab-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ab-muted { color: var(--ink2); font-size: .92rem; }
.ab-p { margin: .6rem 0 0; color: var(--ink2); }
.ab-print-only { display: none; }
.grow { flex: 1; }

/* ---------- Encabezado y navegación ---------- */
.ab-top { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; height: 68px; background: var(--teal); color: #fff; }
.ab-brand { display: flex; align-items: baseline; gap: 12px; }
.ab-logo { font-family: var(--serif); font-weight: 700; font-size: 2rem; letter-spacing: .12em; line-height: 1; }
.ab-sub { font-size: .8rem; letter-spacing: .32em; text-transform: lowercase; opacity: .9; }
.ab-top-r { display: flex; align-items: center; gap: 12px; }
.ab-role { display: flex; align-items: center; gap: 8px; font-size: .82rem; }
.ab-role select { background: rgba(255,255,255,.14); color: #fff; border: 1px solid rgba(255,255,255,.4); border-radius: 10px; padding: 7px 10px; min-height: 38px; }
.ab-role select option { color: var(--ink); }
.ab-nav { display: flex; gap: 4px; padding: 0 16px; background: #fff; border-bottom: 1px solid var(--line); overflow-x: auto; position: sticky; top: 68px; z-index: 29; }
.ab-tab { background: none; border: 0; padding: 14px 16px; font-weight: 500; color: var(--ink2); border-bottom: 3px solid transparent; white-space: nowrap; min-height: 48px; }
.ab-tab.on { color: var(--teal); border-bottom-color: var(--teal); font-weight: 600; }
.ab-tab:hover { color: var(--teal-d); }
.ab-main { padding: 18px 20px 90px; max-width: 1500px; margin: 0 auto; }
.ab-banner { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 10px 20px; background: var(--lav-l); color: #3F3A9E; font-size: .92rem; }

/* ---------- Botones y controles ---------- */
.ab-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 42px; padding: 8px 16px; border-radius: 12px; border: 1.5px solid var(--line); background: #fff; font-weight: 500; text-decoration: none; color: var(--ink); transition: background .12s, border-color .12s; }
.ab-btn:hover { border-color: var(--teal); background: var(--teal-l); }
.ab-btn:disabled { opacity: .45; cursor: not-allowed; }
.ab-primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.ab-primary:hover { background: var(--teal-d); border-color: var(--teal-d); color: #fff; }
.ab-top .ab-primary { background: #fff; color: var(--teal); border-color: #fff; }
.ab-top .ab-primary:hover { background: var(--teal-l); }
.ab-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.ab-danger:hover { background: #8A2218; border-color: #8A2218; color: #fff; }
.ab-quiet { border-color: transparent; background: transparent; }
.ab-danger-t { color: var(--bad); }
.ab-sm { min-height: 34px; padding: 4px 12px; font-size: .88rem; border-radius: 10px; }
.ab-icon { min-width: 42px; padding: 8px; }
.ab-icon.ab-sm { min-width: 34px; }
.ab-wa { color: #0B6B3A; border-color: #BFE3CE; background: #EAF7F0; }
.ab-wa:hover { background: #D8F0E3; border-color: #0B6B3A; }
.ab-primary.ab-wa { background: #0B7A43; border-color: #0B7A43; color: #fff; }
.ab-primary.ab-wa:hover { background: #086236; }
.ab-link { background: none; border: 0; padding: 0; color: var(--lav-ink); text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
.ab-input { width: 100%; min-height: 42px; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #fff; }
.ab-input:focus { border-color: var(--teal); outline: none; box-shadow: 0 0 0 3px var(--teal-l); }
textarea.ab-input { resize: vertical; }
.ab-input:disabled { background: #F2EFEB; color: var(--ink2); }
.ab-seg { display: inline-flex; flex-wrap: wrap; background: #EFEAE5; border-radius: 12px; padding: 3px; gap: 2px; }
.ab-seg button { border: 0; background: transparent; padding: 7px 14px; min-height: 38px; border-radius: 9px; font-weight: 500; color: var(--ink2); display: inline-flex; align-items: center; gap: 6px; }
.ab-seg button.on { background: #fff; color: var(--teal); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
.ab-seg-s button { padding: 5px 10px; min-height: 34px; font-size: .86rem; }
.ab-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.ab-pill { display: inline-block; padding: 2px 10px; border-radius: 999px; background: var(--lav-l); color: var(--lav-ink); font-size: .8rem; font-weight: 500; }
.ab-badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .76rem; font-weight: 600; white-space: nowrap; }
.ab-badge.st-pendiente { background: #FFF1CF; color: #7A5200; }
.ab-badge.st-confirmada { background: #D8EFEB; color: #05555A; }
.ab-badge.st-realizada { background: #E4E9ED; color: #34434F; }
.ab-badge.st-cancelada, .ab-badge.st-retenido { background: #FBE3DF; color: #8F2D22; }
.ab-badge.st-no_asistio { background: #ECE6DF; color: #5A4A3A; }
.ab-chk { display: flex; align-items: center; gap: 8px; min-height: 42px; }
.ab-chk input { width: 20px; height: 20px; accent-color: var(--teal); }
.ab-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }
.ab-empty { padding: 22px; text-align: center; color: var(--ink2); background: #fff; border: 1.5px dashed var(--line); border-radius: 14px; }
.ab-card { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(35,48,58,.04); }
.ab-h3 { margin: 0 0 8px; } .ab-h4 { margin: 18px 0 8px; color: var(--teal); }

/* ---------- Barra de herramientas ---------- */
.ab-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 14px; }
.ab-datenav { display: flex; align-items: center; gap: 6px; }
.ab-date { width: auto; min-width: 150px; }
.ab-title { font-size: 1.7rem; flex: 1 1 200px; color: var(--teal-d); }
.ab-search { max-width: 340px; }

/* ---------- Grilla diaria ---------- */
.ab-gridwrap { overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 16px; max-height: calc(100vh - 290px); min-height: 380px; position: relative; }
.ab-grid { display: grid; grid-template-columns: 54px repeat(var(--n), minmax(170px, 1fr)); min-width: min-content; }
.ab-timecol { position: sticky; left: 0; z-index: 8; background: #fff; border-right: 1px solid var(--line); }
.ab-colhead { position: sticky; top: 0; z-index: 7; height: 52px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; border-bottom: 3px solid var(--pc, var(--line)); }
.ab-colhead b { font-family: var(--serif); font-size: 1.2rem; font-weight: 700; color: var(--ink); }
.ab-colhead small { color: var(--ink2); font-size: .78rem; }
.ab-timecol .ab-colhead { z-index: 9; }
.ab-times { position: relative; }
.ab-hr { position: absolute; left: 0; right: 0; }
.ab-hr:first-child span { transform: none; top: 3px; }
.ab-hr span { position: absolute; right: 6px; transform: translateY(-50%); font-size: .75rem; color: var(--ink2); background: #fff; padding: 0 2px; }
.ab-colwrap { border-left: 1px solid var(--line); min-width: 0; }
.ab-col { position: relative; cursor: cell; background-color: #EEE9E4; background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.035) 0 6px, transparent 6px 12px); }
.ab-col.drop { outline: 3px dashed var(--lav); outline-offset: -3px; }
.ab-av { position: absolute; left: 0; right: 0; background: #fff; }
.ab-col > i { position: absolute; left: 0; right: 0; border-top: 1px solid rgba(35,48,58,.09); pointer-events: none; }
.ab-now { position: absolute; left: 0; right: 0; border-top: 2px solid var(--coral); z-index: 4; pointer-events: none; }
.ab-now::before { content: ''; position: absolute; left: -1px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--coral); }
.ab-blk { position: absolute; left: 4px; right: 4px; z-index: 3; padding: 3px 8px 3px 9px; border-radius: 10px; background: var(--pt); border-left: 5px solid var(--pc); box-shadow: 0 1px 3px rgba(35,48,58,.18); overflow: hidden; cursor: pointer; touch-action: manipulation; font-size: .8rem; line-height: 1.2; }
.ab-blk[data-drag] { cursor: grab; }
.ab-blk:hover { box-shadow: 0 3px 10px rgba(35,48,58,.25); z-index: 5; }
.ab-blk.dragging { z-index: 20; opacity: .9; box-shadow: 0 10px 26px rgba(35,48,58,.35); cursor: grabbing; }
.ab-blk-h { display: flex; justify-content: space-between; gap: 6px; color: var(--ink2); font-size: .74rem; font-weight: 500; }
.ab-blk-h em { font-style: normal; font-weight: 600; }
.ab-blk-c { font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-blk-s, .ab-blk-x { color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ab-blk-x { color: var(--lav-ink); font-weight: 500; }
.ab-blk.short { display: flex; gap: 8px; align-items: center; padding-top: 1px; padding-bottom: 1px; }
.ab-blk.short .ab-blk-h em { display: none; }
.ab-blk.st-pendiente { background: #fff; background-image: repeating-linear-gradient(135deg, var(--pt) 0 7px, #fff 7px 14px); outline: 1.5px dashed var(--pc); outline-offset: -2px; }
.ab-blk.st-pendiente .ab-blk-h em { color: #7A5200; }
.ab-blk.st-confirmada .ab-blk-h em { color: var(--teal-d); }
.ab-blk.st-realizada { opacity: .72; }
.ab-blk.st-no_asistio { filter: grayscale(1); opacity: .7; }
.ab-drag-tip { position: fixed; z-index: 99; background: var(--ink); color: #fff; padding: 4px 10px; border-radius: 8px; font-size: .85rem; pointer-events: none; }
.ab-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin: 12px 2px 0; color: var(--ink2); font-size: .82rem; }
.ab-sw { display: inline-block; width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line); vertical-align: -3px; margin-right: 4px; }
.ab-sw.av { background: #fff; } .ab-sw.un { background: #EEE9E4; background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.08) 0 3px, transparent 3px 6px); }
.ab-sw.pe { background: #fff; border: 1.5px dashed var(--teal); } .ab-sw.co { background: var(--teal-l); border-left: 4px solid var(--teal); }

/* ---------- Vista de semana ---------- */
.ab-week { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; align-items: start; }
.ab-wkday { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.ab-wkday.today { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal-l); }
.ab-wkday.quiet { background: #FBF9F7; }
.ab-wkhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ab-wkhead b { font-family: var(--serif); font-size: 1.15rem; color: var(--teal-d); }
.ab-wkhead span, .ab-wkload { font-size: .8rem; color: var(--ink2); }
.ab-bar { height: 8px; background: #ECE7E2; border-radius: 99px; overflow: hidden; flex: 1; }
.ab-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--teal), var(--lav)); border-radius: 99px; }
.ab-wk { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 8px 10px; border-radius: 10px; border: 0; border-left: 5px solid var(--pc); background: var(--pt); align-items: flex-start; }
.ab-wk.st-pendiente { outline: 1.5px dashed var(--pc); outline-offset: -2px; }
.ab-wk.st-realizada { opacity: .72; }
.ab-wk-t { font-size: .78rem; color: var(--ink2); font-weight: 500; }
.ab-wk b { font-size: .95rem; } .ab-wk-s, .ab-wk-p { font-size: .8rem; color: var(--ink2); }
.ab-wkempty { color: var(--ink2); font-size: .85rem; }

/* ---------- Modales ---------- */
.ab-back { position: fixed; inset: 0; z-index: 60; background: rgba(35,48,58,.55); display: flex; align-items: center; justify-content: center; padding: 16px; animation: abfade .15s ease; }
.ab-modal { background: #fff; width: min(520px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; border-radius: 18px; box-shadow: 0 24px 60px rgba(0,0,0,.35); overflow: hidden; }
.ab-modal.wide { width: min(780px, 100%); }
.ab-mh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.ab-mh h2 { font-size: 1.6rem; color: var(--teal-d); }
.ab-mb { padding: 16px 20px; overflow: auto; flex: 1; }
.ab-mb h2 { font-size: 1.5rem; color: var(--teal-d); }
.ab-mf { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 20px; border-top: 1px solid var(--line); background: #FBF9F7; }
.ab-mf.wrap { flex-wrap: wrap; justify-content: flex-start; }
@keyframes abfade { from { opacity: 0; } to { opacity: 1; } }
.ab-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 90; background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; display: flex; gap: 14px; align-items: center; max-width: min(560px, calc(100vw - 24px)); box-shadow: 0 8px 28px rgba(0,0,0,.3); }
.ab-toast.err { background: var(--bad); }
.ab-toast .ab-link { color: #CFCBFF; }

/* ---------- Formularios ---------- */
.ab-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px 14px; }
.ab-f { display: flex; flex-direction: column; gap: 4px; font-size: .86rem; font-weight: 500; color: var(--ink2); }
.ab-f > small, .ab-f small { font-weight: 400; color: var(--ink2); font-size: .76rem; }
.ab-f.full { grid-column: 1 / -1; }
.ab-f.inline { flex-direction: row; align-items: center; gap: 8px; }
.ab-f.inline .ab-input { width: 130px; }
.ab-sec { margin-bottom: 20px; }
.ab-sec > h3 { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 1.25rem; }
.ab-sec > h3 span { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--teal); color: #fff; font-family: var(--sans); font-size: .8rem; font-weight: 600; }
.ab-selclient { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 14px; border: 1.5px solid var(--teal); background: var(--teal-l); border-radius: 12px; }
.ab-selclient small { display: block; color: var(--ink2); }
.ab-cres { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
.ab-cres-i { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; padding: 10px 14px; min-height: 46px; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; }
.ab-cres-i:hover { border-color: var(--teal); background: var(--teal-l); }
.ab-cres-i small { color: var(--ink2); }
.ab-cres-i.new { justify-content: flex-start; color: var(--lav-ink); border-style: dashed; font-weight: 600; }
.addsvc { margin-top: 10px; }
.ab-ln { border: 1.5px solid var(--line); border-left: 6px solid var(--pc); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; background: #fff; }
.ab-ln.locked { background: #F6F3F0; }
.ab-ln > header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.ab-ln-t { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; flex: 1; }
.ab-ln-t b { font-size: 1.02rem; }
.ab-ln-g { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.ab-ln-free { margin: 10px 0 6px; font-size: .86rem; color: var(--ink2); }
.ab-chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow: auto; padding: 2px; }
.ab-chip { min-width: 62px; min-height: 40px; padding: 6px 10px; border-radius: 10px; border: 1.5px solid var(--lav); background: #fff; color: var(--lav-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ab-chip:hover { background: var(--lav-l); }
.ab-chip.on { background: var(--teal); border-color: var(--teal); color: #fff; }
.ab-ln-man { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-top: 8px; }
.ab-ln-sel { font-size: .92rem; }
.ab-ln-sel .ab-badge { margin-left: 8px; }
.ab-warn { color: var(--warn); font-weight: 500; }
.ab-issues { margin: 8px 0 0; padding: 10px 14px 10px 30px; border-radius: 12px; font-size: .9rem; }
.ab-issues.err { background: #FDECEA; color: #8F2D22; } .ab-issues.warn { background: #FFF6DE; color: #6E4A00; }
.ab-money { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; margin: 12px 0 4px; }
.ab-money > div { background: #FBF9F7; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
.ab-money span { display: block; font-size: .74rem; color: var(--ink2); text-transform: uppercase; letter-spacing: .05em; }
.ab-money b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.ab-money b.ok { color: var(--ok); } .ab-money b.warn { color: var(--warn); }

/* ---------- Detalle ---------- */
.ab-tbl { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: .92rem; }
.ab-tbl th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.ab-tbl td { padding: 8px; border-bottom: 1px solid #F0EBE6; vertical-align: top; }
.ab-tbl td small { display: block; color: var(--ink2); } .ab-tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.ab-tbl .ab-dot { margin-right: 6px; }
.ab-note { margin: 8px 0; padding: 8px 12px; background: var(--coral-l); border-radius: 10px; color: #6F332B; }
.ab-pays, .ab-hist, .ab-chist { margin: 6px 0; padding-left: 18px; color: var(--ink2); font-size: .88rem; }
.ab-hist time { color: var(--ink); font-weight: 500; margin-right: 6px; }
.ab-det { margin-top: 12px; } .ab-det summary { cursor: pointer; color: var(--lav-ink); font-weight: 500; }

/* ---------- Resumen semanal ---------- */
.ab-sumgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; align-items: start; }
.ab-sumpro { border-top: 5px solid var(--pc); }
.ab-sumpro > header { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.ab-sumpro small { color: var(--ink2); }
.ab-kpis { display: flex; gap: 18px; }
.ab-kpis div { display: flex; flex-direction: column; } .ab-kpis b { font-family: var(--serif); font-size: 1.6rem; line-height: 1; color: var(--teal-d); } .ab-kpis span { font-size: .72rem; color: var(--ink2); }
.ab-tblwrap { overflow-x: auto; }
.ab-sumtbl { width: 100%; border-collapse: collapse; font-size: .9rem; margin-bottom: 8px; }
.ab-sumtbl th, .ab-sumtbl td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #F0EBE6; }
.ab-sumtbl thead th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--ink2); }
.ab-bcell { display: flex; align-items: center; gap: 8px; min-width: 130px; } .ab-bcell span { font-size: .8rem; width: 36px; text-align: right; }
.ab-sumday h4 { margin: 14px 0 6px; color: var(--teal-d); }
.ab-sumit { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; align-items: start; width: 100%; text-align: left; padding: 9px 12px; margin-bottom: 6px; background: #FBF9F7; border: 1px solid var(--line); border-radius: 10px; }

.ab-hero .eyebrow { font-size: .74rem; letter-spacing: .22em; text-transform: uppercase; color: var(--teal); font-weight: 500; }
.ab-hero h2 { font-size: 2.2rem; margin: 2px 0 6px; color: var(--teal-d); }
.ab-hero p { margin: 0; max-width: 62ch; color: var(--ink); }
.ab-hero .wm { position: absolute; right: -10px; bottom: -34px; height: 230px; width: auto; opacity: .1; pointer-events: none; }
@media (max-width: 760px) { .ab-hero { gap: 14px; padding: 14px 16px; } .ab-hero .mark { height: 56px; } .ab-hero h2 { font-size: 1.4rem; } .ab-hero .wm { height: 150px; } .ab-sumhead .cnt { font-size: .76rem; } }

.ab-bdlist { display: flex; flex-direction: column; gap: 8px; }
.ab-bdrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 1px solid var(--line); border-left: 5px solid var(--lav); border-radius: 12px; background: #FDFCFF; }
.ab-bdrow.sent { opacity: .75; } .ab-bdrow .who { flex: 1; min-width: 0; } .ab-bdrow .who small { display: block; color: var(--ink2); }
.ab-bdrow .day { width: 44px; height: 44px; flex: none; border-radius: 12px; background: var(--lav-l); color: var(--lav-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: .66rem; text-transform: uppercase; letter-spacing: .05em; } .ab-bdrow .day b { font-family: var(--serif); font-size: 1.3rem; line-height: 1; }

/* ---------- Modo nube: sesión, estado de sincronización, vinculación de Telegram ---------- */
.ab-user { font-size: .86rem; opacity: .95; white-space: nowrap; }
.ab-sync { font-size: .76rem; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.16); white-space: nowrap; }
.ab-sync.st-ok { opacity: .85; } .ab-sync.st-pending, .ab-sync.st-saving { background: rgba(255,255,255,.26); }
.ab-sync.st-error { background: #FFE9E6; color: var(--bad); font-weight: 600; }
.ab-sync.st-idle { display: none; }
.ab-login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.ab-login-card { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 14px; padding: 28px 24px; }
.ab-login-logo { width: 190px; max-width: 70%; align-self: center; margin-bottom: 4px; }
.ab-login-err { margin: 0; min-height: 1.2em; color: var(--bad); font-size: .9rem; }
.ab-tgcode { margin-top: 12px; padding: 14px; border-radius: 12px; background: var(--lav-l); }
.ab-tgcode > b { font-family: var(--serif); font-size: 2rem; letter-spacing: .18em; color: var(--lav-ink); }
@media (max-width: 760px) { .ab-user { display: none; } .ab-sync { font-size: .7rem; padding: 2px 7px; } }
.ab-login-card .ab-primary { color: #fff; justify-content: center; }
.ab-table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: .92rem; }
.ab-table th { text-align: left; font-weight: 600; color: var(--ink2); font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.ab-table td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.ab-table .r { text-align: right; } .ab-table small { display: block; color: var(--ink2); }

</style>

const weekStart = s => { const d = parseYmd(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return ymd(d); };

/* ---------- Persistencia ---------- */
let state;
function migrate(o) {
  o.cfg = o.cfg || {};
  // Los datos de ejemplo de la primera versión se renuevan; lo que no es de ejemplo no se toca.
  if (o.cfg.demo && o.cfg.demoVer !== 3) { o.appts = o.appts.filter(a => !a.demo); o.clients = o.clients.filter(c => !c.demo); o.exceptions = (o.exceptions || []).filter(e => !e.demo); seedDemo(o); o.cfg.demoVer = 3; }
  if (o.cfg.bdayPct == null) o.cfg.bdayPct = 15;
  return o;
}
function load() {
  try { const s = localStorage.getItem(KEY); if (s) { const o = JSON.parse(s); if (o && o.v === VERSION && o.appts) return migrate(o); } } catch (e) { /* sin almacenamiento */ }
  return seed();
}
function save() { if (CLOUD_ON) { cloudDirty(); return; } try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* modo sin persistencia */ } }
state = CLOUD_ON ? emptyState() : load();

/* ---------- Disponibilidad y espacios libres ---------- */
function mergeRanges(r) {
  r = r.filter(x => x[1] > x[0]).sort((a, b) => a[0] - b[0]);
  const out = [];
  r.forEach(x => { if (out.length && x[0] <= out[out.length - 1][1]) out[out.length - 1][1] = Math.max(out[out.length - 1][1], x[1]); else out.push([x[0], x[1]]); });
  return out;
}
function subtractRanges(base, cut) {
  let res = base.map(x => x.slice());
  mergeRanges(cut).forEach(c => {
    const next = [];
    res.forEach(b => {
      if (c[1] <= b[0] || c[0] >= b[1]) { next.push(b); return; }
      if (c[0] > b[0]) next.push([b[0], c[0]]);
      if (c[1] < b[1]) next.push([c[1], b[1]]);
    });
    res = next;
  });
  return res;
}
// Horario que la profesional definió para ese día (semanal + excepciones).
function availRanges(proId, date) {
  const base = ((state.avail[proId] || {})[dowOf(date)] || []).map(r => r.slice());
  const ex = state.exceptions.filter(e => e.pro === proId && e.date === date);
  const opens = ex.filter(e => e.type === 'open').map(e => [e.start, e.end]);
  const blocks = ex.filter(e => e.type === 'block').map(e => [e.start, e.end]);
  return subtractRanges(mergeRanges(base.concat(opens)), blocks);
}
// Intervalos ocupados por citas vigentes de una profesional ese día.
function busyOf(proId, date, ignoreApptId) {
  const out = [];
  state.appts.forEach(a => {
    if (a.date !== date || a.id === ignoreApptId || !isLive(a)) return;
    a.lines.forEach(l => { if (l.pro === proId) out.push({ s: l.start, e: l.start + l.dur, apptId: a.id, lineId: l.id }); });
  });
  return out.sort((x, y) => x.s - y.s);
}
function freeRanges(proId, date, o) {
  o = o || {};
  const buf = state.cfg.buffer;
  const busy = busyOf(proId, date, o.ignoreApptId).map(b => [b.s - buf, b.e + buf]).concat(o.extraBusy || []);
  return subtractRanges(availRanges(proId, date), busy);
}
// Horarios de inicio propuestos para un servicio de `d` minutos. La elección final es manual.
function proposeSlots(proId, date, d, o) {
  const step = state.cfg.step, out = new Set(), today = date === todayStr(), nm = nowMin();
  freeRanges(proId, date, o).forEach(r => {
    const starts = [r[0]];
    for (let t = Math.ceil(r[0] / step) * step; t + d <= r[1]; t += step) starts.push(t);
    starts.forEach(t => { if (t + d <= r[1] && (!today || t >= nm)) out.add(t); });
  });
  return Array.from(out).sort((a, b) => a - b);
}
function overlaps(s1, e1, s2, e2) { return s1 < e2 && s2 < e1; }

// Revisa si una línea cabe: devuelve {proClash, clientClash, outside}
function checkLine(proId, date, start, d, o) {
  o = o || {};
  const buf = state.cfg.buffer, end = start + d;
  const proClash = busyOf(proId, date, o.ignoreApptId).filter(b => !(o.ignoreLineId && b.lineId === o.ignoreLineId) && overlaps(start, end, b.s - buf, b.e + buf))[0] || null;
  const clientClash = (o.extraBusy || []).filter(r => overlaps(start, end, r[0], r[1]))[0] || null;
  const av = availRanges(proId, date);
  const outside = !av.some(r => start >= r[0] && end <= r[1]);
  return { proClash, clientClash, outside };
}

async function fetchAll(table, sel, build) {

    let q = sb.from(table).select(sel || '*'); if (build) q = build(q);
    const { data, error } = await q.range(from, from + 999);
    if (error) throw new Error(table + ': ' + error.message);
    out.push.apply(out, data || []); if (!data || data.length < 1000) break;
  }
  return out;
}
async function fetchState() {

    fetchAll('pros', '*', q => q.order('sort')), fetchAll('services', '*', q => q.order('sort')), fetchAll('availability', '*', q => q.order('id')),
    fetchAll('exceptions', '*', q => q.order('id')), fetchAll('clients', '*', q => q.order('id')),
    fetchAll('appointments', '*, appointment_lines(*), payments(*), appointment_history(*)', q => q.order('id')),
    sb.from('settings').select('data').eq('id', 1).maybeSingle()

/* ---------- Sincronización (diferencias respecto de lo último guardado) ---------- */
const ORDER_UP = ['pros', 'services', 'clients', 'appointments', 'appointment_lines', 'payments', 'appointment_history', 'exceptions'];
const ORDER_DEL = ['payments', 'appointment_lines', 'exceptions', 'appointments', 'clients', 'services'];
const CONFLICT = { appointment_history: 'appt_id,ts,text' };
async function pushDiff(prev, cur) {
  const chk = (r, t) => { if (r.error) { const e = new Error(t + ': ' + r.error.message); e.code = r.error.code; throw e; } };
  const changed = (t) => Object.keys(cur[t]).filter(k => !prev[t][k] || JSON.stringify(prev[t][k]) !== JSON.stringify(cur[t][k]));
  for (const t of ORDER_UP) {
    const ids = changed(t); if (!ids.length) continue;
    for (let i = 0; i < ids.length; i += 200) {
      const rows = ids.slice(i, i + 200).map(k => cur[t][k]);
      chk(await sb.from(t).upsert(rows, CONFLICT[t] ? { onConflict: CONFLICT[t], ignoreDuplicates: true } : undefined), t);
    }
  }
  for (const pro of Object.keys(cur.availability)) {
    if (JSON.stringify(prev.availability[pro]) === JSON.stringify(cur.availability[pro])) continue;
    chk(await sb.from('availability').delete().eq('pro_id', pro), 'availability');
    const rows = cur.availability[pro].map(r => ({ pro_id: pro, dow: r[0], start_min: r[1], end_min: r[2] }));
    if (rows.length) chk(await sb.from('availability').insert(rows), 'availability');
  }
  if (JSON.stringify(prev.settings['1']) !== JSON.stringify(cur.settings['1']) && isAdminProfile()) chk(await sb.from('settings').upsert(cur.settings['1']), 'settings');
  for (const t of ORDER_DEL) {
    if (t === 'appointment_history') continue;
    const gone = Object.keys(prev[t]).filter(k => !cur[t][k]); if (!gone.length) continue;
    for (let i = 0; i < gone.length; i += 100) chk(await sb.from(t).delete().in('id', gone.slice(i, i + 100)), t);
  }
}
const isAdminProfile = () => !!cloudProfile && cloudProfile.role === 'admin';

function cloudDirty() {
  if (!lastRows) return;                       // aún no cargó: no hay nada que comparar
  dirty = true; setSync('pending'); clearTimeout(syncTimer); syncTimer = setTimeout(flush, 700);
}
async function flush() {
  clearTimeout(syncTimer); syncTimer = null;
  if (syncing || !dirty || !lastRows) return;
  syncing = true; dirty = false; setSync('saving');
  const cur = toRows(state);
  try {
    await pushDiff(lastRows, cur); lastRows = cur; failN = 0; ignoreUntil = Date.now() + 2500;
    setSync(dirty ? 'pending' : 'ok');
  } catch (e) {
    dirty = true; failN++; setSync('error', e.message);
    syncTimer = setTimeout(flush, Math.min(60000, 3000 * Math.pow(2, failN - 1)));
  } finally { syncing = false; if (dirty && !syncTimer) syncTimer = setTimeout(flush, 700); }
}

function cloudPH() {
  let list = [];
  const fromRow = r => ({ id: r.id, clientId: r.client_id, apptId: r.appt_id, lineId: r.line_id || '', label: r.label || '', pro: r.pro_id || '', date: r.date || '', created: Date.parse(r.created_at) || 0, portfolio: !!r.portfolio, w: r.w, h: r.h, thumb: r.thumb, path: r.path });
  const toRow = rec => ({ id: rec.id, client_id: rec.clientId, appt_id: rec.apptId || null, line_id: rec.lineId || '', label: rec.label || '', pro_id: rec.pro || '', date: rec.date || null, portfolio: !!rec.portfolio, w: rec.w || null, h: rec.h || null, thumb: rec.thumb || null, path: rec.path });
  return {
    get persistent() { return true; },
    all: () => list,
    async init() { const rows = await fetchAll('photos', '*', q => q.order('created_at')); list = rows.map(fromRow); return list; },
    async add(rec, blob) {
      rec.path = rec.id + '.jpg';
      const up = await sb.storage.from(BUCKET).upload(rec.path, blob, { contentType: 'image/jpeg', upsert: false });
      if (up.error) throw new Error(up.error.message);
      const ins = await sb.from('photos').insert(toRow(rec));
      if (ins.error) { await sb.storage.from(BUCKET).remove([rec.path]); throw new Error(ins.error.message); }
      list.push(rec);
    },
    async full(id) { const r = list.find(p => p.id === id); if (!r) return null; const { data, error } = await sb.storage.from(BUCKET).download(r.path); return error ? null : data; },
    async update(rec) { const { error } = await sb.from('photos').update({ label: rec.label || '', portfolio: !!rec.portfolio }).eq('id', rec.id); if (error) throw new Error(error.message); },
    async remove(id) {
      const r = list.find(p => p.id === id); if (!r) return;
      const d1 = await sb.storage.from(BUCKET).remove([r.path]); if (d1.error) throw new Error(d1.error.message);   // primero el archivo (la política lo exige mientras exista la fila)
      const d2 = await sb.from('photos').delete().eq('id', id); if (d2.error) throw new Error(d2.error.message);
      list = list.filter(p => p.id !== id);
    },
    async clear() { /* no se vacía la nube desde la web */ }
  };
}

  let lo = Math.floor(Math.min.apply(null, pts) / 60) * 60, hi = Math.ceil(Math.max.apply(null, pts) / 60) * 60;
  if (hi - lo < 240) hi = lo + 240;

}
function renderWeek() {
  const ws = weekStart(ui.date);
  const sel = ui.weekPro;
  const proIds = sel === 'all' ? visiblePros().map(p => p.id) : [sel];
  const days = [0, 1, 2, 3, 4, 5, 6].map(i => addDays(ws, i));
  const cols = days.map(d => {
    const visits = state.appts.filter(a => a.date === d && isLive(a) && a.lines.some(l => proIds.includes(l.pro)))
      .sort((x, y) => apptStart(x) - apptStart(y));
    const ld = loadOf(proIds, d);
    const items = visits.map(a => {
      const mine = a.lines.filter(l => proIds.includes(l.pro));
      const s = Math.min.apply(null, mine.map(l => l.start)), e = Math.max.apply(null, mine.map(l => l.start + l.dur));
      const pro = proById(mine[0].pro);
      return `<button class="ab-wk st-${a.status}" data-act="open-appt" data-appt="${a.id}" style="--pc:${pro.color};--pt:${pro.tint}">
        <span class="ab-wk-t">${fmtT(s)}–${fmtT(e)}</span><b>${esc(cname(a))}</b>
        <span class="ab-wk-s">${esc(mine.map(l => lineLabel(l)).join(' + '))}</span>
        <span class="ab-wk-p">${esc(Array.from(new Set(a.lines.map(l => proName(l.pro)))).join(' → '))}${a.place === 'home' ? ' · domicilio' : ''}</span>
        ${badge(a.status)}</button>`;
    }).join('');
    const pct = ld.avail ? Math.min(100, Math.round(ld.booked * 100 / ld.avail)) : (ld.booked ? 100 : 0);
    const today = d === todayStr();
    return `<div class="ab-wkday ${today ? 'today' : ''} ${visits.length ? '' : 'quiet'}">
      <div class="ab-wkhead"><button class="ab-link" data-act="goto-day" data-date="${d}"><b>${esc(fmtShort(d))}</b></button><span>${visits.length} ${visits.length === 1 ? 'cita' : 'citas'}</span></div>
      <div class="ab-bar" title="${dur(ld.booked)} de ${dur(ld.avail)} disponibles"><i style="width:${pct}%"></i></div>
      <div class="ab-wkload">${ld.avail || ld.booked ? `${dur(ld.booked)} reservadas${ld.avail ? ` de ${dur(ld.avail)}` : ''}` : 'Sin horario'}</div>
      ${items || '<div class="ab-wkempty">Sin citas</div>'}</div>`;
  }).join('');
  return `<div class="ab-week">${cols}</div>`;
}

/* ---------- Clic en un espacio libre de la grilla ---------- */
let suppressClick = false;
function onGridClick(e) {
  if (suppressClick) return false;
  const col = e.target.closest('.ab-col');
  if (!col || e.target.closest('.ab-blk')) return false;
  const rect = col.getBoundingClientRect();
  const lo = +col.dataset.lo, step = state.cfg.step;
  const min = Math.floor((e.clientY - rect.top) / PX / step) * step + lo;
  openWizard({ date: col.dataset.date, pro: col.dataset.pro, start: min });
  return true;
}

/* ---------- Arrastrar y soltar (mouse) ---------- */
let drag = null;
root.addEventListener('pointerdown', e => {
  const b = e.target.closest('.ab-blk[data-drag]');
  if (!b || e.pointerType === 'touch' || e.button !== 0) return;
  const gw = b.closest('.ab-gridwrap');
  drag = { el: b, apptId: b.dataset.appt, lineId: b.dataset.line, x0: e.clientX, y0: e.clientY, moved: false, top0: parseFloat(b.style.top), col: b.closest('.ab-col'), gw, sc0: gw ? gw.scrollTop : 0, scl0: gw ? gw.scrollLeft : 0 };
  b.setPointerCapture(e.pointerId);
});
root.addEventListener('pointermove', e => {
  if (!drag) return;
  const gw = drag.gw;
  if (drag.moved && gw) { const r = gw.getBoundingClientRect(); if (e.clientY > r.bottom - 36) gw.scrollTop += 18; else if (e.clientY < r.top + 70) gw.scrollTop -= 18; }
  const dx = e.clientX - drag.x0 + (gw ? gw.scrollLeft - drag.scl0 : 0), dy = e.clientY - drag.y0 + (gw ? gw.scrollTop - drag.sc0 : 0);
  if (!drag.moved && Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) < 6) return;
  if (!drag.moved) { drag.moved = true; drag.el.classList.add('dragging'); document.body.classList.add('ab-dragging'); }
  drag.el.style.transform = `translate(${dx}px,${dy}px)`;
  const tgt = dropTarget(e);
  $$('.ab-col.drop', root).forEach(c => c.classList.remove('drop'));
  if (tgt) { tgt.col.classList.add('drop'); showTip(e, `${fmtT(tgt.start)} · ${proName(tgt.pro)}`); }
});
function dropTarget(e) {
  if (!drag) return null;
  drag.el.style.pointerEvents = 'none';
  const under = document.elementFromPoint(e.clientX, e.clientY);
  drag.el.style.pointerEvents = '';
  const col = under && under.closest ? under.closest('.ab-col') : null;
  if (!col) return null;
  const lo = +col.dataset.lo, step = state.cfg.step;
  const dy = e.clientY - drag.y0 + (drag.gw ? drag.gw.scrollTop - drag.sc0 : 0);
  const raw = (drag.top0 + dy) / PX + (+drag.col.dataset.lo);
  return { col, pro: col.dataset.pro, start: Math.max(0, Math.round(raw / step) * step), lo };
}
function showTip(e, text) {
  let t = $('.ab-drag-tip', root);
  if (!t) { t = document.createElement('div'); t.className = 'ab-drag-tip'; root.appendChild(t); }
  t.textContent = text; t.style.left = (e.clientX + 14) + 'px'; t.style.top = (e.clientY + 14) + 'px';
}
root.addEventListener('pointerup', e => {
  if (!drag) return;
  const d = drag; drag = null;
  const tip = $('.ab-drag-tip', root); if (tip) tip.remove();
  $$('.ab-col.drop', root).forEach(c => c.classList.remove('drop'));
  document.body.classList.remove('ab-dragging');
  if (!d.moved) return;
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 60);
  d.el.classList.remove('dragging'); d.el.style.transform = '';
  drag = d; const tgt = dropTarget(e); drag = null;
  if (tgt) moveLine(d.apptId, d.lineId, tgt.pro, tgt.start);
});
root.addEventListener('pointercancel', () => { if (drag) { drag.el.classList.remove('dragging'); drag.el.style.transform = ''; drag = null; document.body.classList.remove('ab-dragging'); } });

function moveLine(apptId, lineId, pro, start) {
  const a = apptById(apptId); if (!a) return;
  const l = a.lines.find(x => x.id === lineId); if (!l) return;
  if (pro === l.pro && start === l.start) return;
  const c = checkLine(pro, a.date, start, l.dur, { ignoreLineId: l.id, extraBusy: clientBusy(a.clientId, a.date, { ignoreLineId: l.id }) });
  if (c.proClash) { toast(`${proName(pro)} ya tiene otra cita a esa hora. No se movió.`, { kind: 'err' }); renderMain(); return; }
  if (c.clientClash) { toast('La clienta ya tiene otro servicio a esa hora. No se movió.', { kind: 'err' }); renderMain(); return; }
  undoSnap = { id: a.id, data: clone(a) };
  const was = `${proName(l.pro)} ${fmtT(l.start)}`;
  l.pro = pro; l.start = start;
  logH(a, `Reprogramada: ${lineLabel(l)} de ${was} a ${proName(pro)} ${fmtT(start)}`);
  save(); renderMain();
  toast(`Movida a ${fmtT(start)} (${proName(pro)})${c.outside ? ' · fuera del horario disponible' : ''}`, { undo: true });
}

/* =====================================================================
   NUEVA CITA / EDITAR · REPROGRAMAR
   Flujo semi-automático: el sistema propone los horarios libres de cada
   profesional para el día elegido; la selección del horario es manual.

let draft = null;
const nextDow = (from, dow) => { let d = addDays(from, 1); while (dowOf(d) !== dow) d = addDays(d, 1); return d; };

function openWizard(o) {
  o = o || {};
  const today = todayStr();
  if (o.apptId) {
    const a = apptById(o.apptId);
    draft = { id: a.id, edit: true, clientId: a.clientId, newClient: null, date: a.date, place: a.place, surcharge: a.surcharge, adjust: a.adjust, adjustNote: a.adjustNote, notes: a.notes,
      lines: a.lines.map(l => ({ key: uid(), id: l.id, svcId: l.svcId, pkg: l.pkg, name: l.name, pro: l.pro, dur: l.dur, price: l.price, start: l.start, actual: l.actual, custom: !l.svcId })), payNow: 0, payMethod: 'QR', origDate: a.date };
  } else if (o.from) {
    const a = o.from;
    draft = { id: null, edit: false, clientId: a.clientId, newClient: null, date: a.date < today ? today : a.date, place: a.place, surcharge: a.surcharge, adjust: a.adjust, adjustNote: a.adjustNote, notes: '',
      lines: a.lines.map(l => ({ key: uid(), id: null, svcId: l.svcId, pkg: l.pkg, name: l.name, pro: l.pro, dur: l.dur, price: l.price, start: null, actual: null, custom: !l.svcId })), payNow: 0, payMethod: 'QR' };

function lineExtra(L) {
  const extra = clientBusy(draft.clientId, draft.date, { ignoreApptId: draft.id });

  return extra;
}

}
function revalidateLines() {
  draft.lines.forEach(L => {
    if (L.start == null) return;

    if (c.proClash || c.clientClash) { L.start = null; L.cleared = true; }
  });
}

// Re-dibuja sólo las partes dinámicas (propuestas, resumen) sin tocar los campos que se están editando.

    const free = $(`[data-free="${i}"]`), chips = $(`[data-chips="${i}"]`), sel = $(`[data-sel="${i}"]`);

    const extra = lineExtra(L);
    const fr = freeRanges(L.pro, draft.date, { ignoreApptId: draft.id, extraBusy: extra });
    const slots = proposeSlots(L.pro, draft.date, L.dur, { ignoreApptId: draft.id, extraBusy: extra });
    const av = availRanges(L.pro, draft.date);
    const canOpen = true;

}

/* ----- Validaciones ----- */
function wzIssues() {
  const errors = [], warnings = [];
  if (!draft.clientId && !(draft.newClient && draft.newClient.name.trim().length >= 2)) errors.push('Elija o cree la clienta.');
  if (draft.newClient && draft.newClient.name.trim().length >= 2 && !draft.newClient.phone.trim()) warnings.push('La clienta no tiene celular: no se podrá enviar el recordatorio por WhatsApp.');
  if (!draft.lines.length) errors.push('Agregue al menos un servicio.');
  draft.lines.forEach(L => {
    const nm = L.name || (svcById(L.svcId) || {}).name || 'Servicio';
    if (L.custom && !L.name.trim()) errors.push('Escriba el nombre del servicio personalizado.');
    if (L.start == null) { errors.push(`Falta elegir el horario de «${nm}».`); return; }
    const c = lineCheck(L);
    if (c.proClash) errors.push(`«${nm}»: ${proName(L.pro)} ya tiene otra cita a esa hora.`);
    if (c.clientClash) errors.push(`«${nm}»: se cruza con otro servicio de la misma clienta.`);
    if (c.outside && !c.proClash) warnings.push(`«${nm}» queda fuera del horario disponible de ${proName(L.pro)}.`);
    if (L.start + L.dur > 1440) errors.push(`«${nm}» termina después de medianoche.`);
  });
  const today = todayStr();
  if (draft.date < today) warnings.push('La fecha ya pasó (registro retroactivo).');

ACT['wz-save'] = async () => {
  const { errors, warnings } = wzIssues();

  if (warnings.length) {
    const ok = await askConfirm({ title: 'Revise antes de guardar', body: `<ul class="ab-issues warn">${warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>`, ok: 'Guardar de todos modos', cancel: 'Volver' });
    if (!ok) return;
  }
  let clientId = draft.clientId, newC = null;
  if (!clientId) {
    newC = { id: uid(), name: draft.newClient.name.trim(), phone: draft.newClient.phone.trim(), bday: '', hair: '', skin: '', prefs: '', notes: '', created: Date.now() };
    state.clients.push(newC); clientId = newC.id;
  }
  const mk = L => ({ id: L.id || uid(), svcId: L.svcId || '', pkg: L.pkg || '', name: L.name || (svcById(L.svcId) || {}).name || 'Servicio', pro: L.pro, start: L.start, dur: L.dur, price: num(L.price), actual: L.actual || null });
  let a;
  if (draft.edit) {
    a = apptById(draft.id);
    const oldLines = a.lines;
    const msgs = [];
    if (a.date !== draft.date) msgs.push(`Reprogramada: ${fmtShort(a.date)} → ${fmtShort(draft.date)}`);
    draft.lines.forEach(L => {
      const o = oldLines.find(x => x.id === L.id);
      if (!o) msgs.push(`Servicio agregado: ${L.name || (svcById(L.svcId) || {}).name}`);
      else if (o.start !== L.start || o.pro !== L.pro) msgs.push(`${lineLabel(o)}: ${proName(o.pro)} ${fmtT(o.start)} → ${proName(L.pro)} ${fmtT(L.start)}`);
    });
    oldLines.forEach(o => { if (!draft.lines.some(L => L.id === o.id)) msgs.push(`Servicio quitado: ${lineLabel(o)}`); });
    a.clientId = clientId; a.date = draft.date; a.place = draft.place; a.surcharge = num(draft.surcharge); a.adjust = num(draft.adjust); a.adjustNote = draft.adjustNote; a.notes = draft.notes;
    a.lines = draft.lines.map(mk);
    if (msgs.length) { logH(a, msgs.join(' · ')); a.reminderSent = false; }
    else logH(a, 'Datos editados');
    reconcileStatus(a);
  } else {
    a = { id: uid(), clientId, date: draft.date, place: draft.place, surcharge: num(draft.surcharge), adjust: num(draft.adjust), adjustNote: draft.adjustNote, status: 'pendiente', notes: draft.notes, created: Date.now(), lines: draft.lines.map(mk), payments: [], history: [{ ts: Date.now(), text: 'Cita creada' }], reminderSent: false };

    reconcileStatus(a);
    state.appts.push(a);
  }
  const d = draft.date; draft = null;
  save(); closeAllModals(); ui.tab = 'agenda'; ui.date = d; renderAll();
  toast(`Cita guardada · ${fmtShort(d)} · ${STATUS[a.status].toLowerCase()}`);
};

function copyText(text) {
  const done = () => toast('Copiado. Péguelo en WhatsApp.');
  if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done)); }
  else fallbackCopy(text, done);
}
function fallbackCopy(text, done) {
  const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select();
  try { document.execCommand('copy'); done(); } catch (e) { toast('No se pudo copiar automáticamente', { kind: 'err' }); }
  t.remove();
}

}

const apptIncome = a => (a.status === 'cancelada' || a.status === 'no_asistio') ? paidOf(a) : apptTotal(a);

const monthLabel = ym => { const p = ym.split('-').map(Number); return `${cap(MON[p[1] - 1])} ${p[0]}`; };

function weekStats(ws) {
  const pros = visiblePros(), days = weekDays(ws), we = addDays(ws, 6);
  const appts = state.appts.filter(a => a.date >= ws && a.date <= we && isLive(a));
  const per = pros.map(p => ({ p, services: 0, booked: 0, avail: 0 }));
  const byDay = days.map(d => ({ date: d, perPro: {}, services: 0, booked: 0, avail: 0, free: 0 }));
  per.forEach(r => byDay.forEach(bd => {
    const ld = loadOf([r.p.id], bd.date);
    const n = state.appts.filter(a => a.date === bd.date && isLive(a)).reduce((s, a) => s + a.lines.filter(l => l.pro === r.p.id).length, 0);
    bd.perPro[r.p.id] = n; bd.services += n; bd.booked += ld.booked; bd.avail += ld.avail; bd.free += Math.max(0, ld.avail - ld.booked);
    r.services += n; r.booked += ld.booked; r.avail += ld.avail;
  }));
  const booked = per.reduce((s, r) => s + r.booked, 0), avail = per.reduce((s, r) => s + r.avail, 0);
  const free = byDay.reduce((s, d) => s + d.free, 0);
  const services = per.reduce((s, r) => s + r.services, 0);
  const top = {};
  appts.forEach(a => a.lines.forEach(l => { if (pros.some(p => p.id === l.pro)) { const k = lineLabel(l); top[k] = (top[k] || 0) + 1; } }));
  const topList = Object.keys(top).map(k => ({ k, n: top[k] })).sort((a, b) => b.n - a.n || a.k.localeCompare(b.k, 'es')).slice(0, 5);
  const clients = new Set(appts.map(a => a.clientId)).size;
  return { pros, per, byDay, appts, booked, avail, free, services, pct: avail ? Math.round(booked * 100 / avail) : 0, topList, clients, rev: appts.reduce((s, a) => s + apptIncome(a), 0) };
}
const capLabel = p => p >= 75 ? 'Alta' : p >= 40 ? 'Media' : 'Baja';
function ring(pct, size) {

}

function dayChart(S) {

    const pct = d.avail ? Math.round(d.booked * 100 / d.avail) : 0;

/* =====================================================================
   FOTOS DE SERVICIOS · CUMPLEAÑOS
   Las fotos se guardan en IndexedDB del navegador (miniatura + imagen reducida).
   Al conectar Supabase pasarán a Storage; la API de PH no cambia.
   ===================================================================== */
const PH = CLOUD_ON ? cloudPH() : (() => {
  let db = null, persistent = false, list = [];
  const mem = new Map();
  const wrap = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
  function open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('alba-photos', 1);
        rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore('meta', { keyPath: 'id' }); d.createObjectStore('full', { keyPath: 'id' }); };
        rq.onsuccess = () => { db = rq.result; persistent = true; res(true); };
        rq.onerror = rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  }
  return {
    get persistent() { return persistent; },
    all: () => list,
    async init() {
      await open();
      if (db) { try { list = await wrap(db.transaction('meta').objectStore('meta').getAll()); } catch (e) { list = []; } }
      return list;
    },
    async add(rec, blob) {
      if (db) { const t = db.transaction(['meta', 'full'], 'readwrite'); t.objectStore('meta').put(rec); t.objectStore('full').put({ id: rec.id, blob }); await new Promise((r, j) => { t.oncomplete = r; t.onerror = () => j(t.error); }); }
      else mem.set(rec.id, blob);
      list.push(rec);
    },
    async full(id) {
      if (db) { try { const r = await wrap(db.transaction('full').objectStore('full').get(id)); return r ? r.blob : null; } catch (e) { return null; } }
      return mem.get(id) || null;
    },
    async update(rec) { if (db) { const t = db.transaction('meta', 'readwrite'); t.objectStore('meta').put(rec); await new Promise(r => { t.oncomplete = r; t.onerror = r; }); } },
    async remove(id) {
      list = list.filter(p => p.id !== id); mem.delete(id);
      if (db) { const t = db.transaction(['meta', 'full'], 'readwrite'); t.objectStore('meta').delete(id); t.objectStore('full').delete(id); await new Promise(r => { t.oncomplete = r; t.onerror = r; }); }
    },
    async clear() { const ids = list.map(p => p.id); for (const id of ids) await this.remove(id); }
  };
})();

function canSeePhoto(p) {
  if (isAdmin()) return true;
  if (p.pro) return p.pro === me();
  const a = p.apptId && apptById(p.apptId);
  return !!(a && mineAppt(a));
}
const canEditPhoto = p => isAdmin() || p.pro === me();

async function decodeImage(file) {
  if (window.createImageBitmap) { try { return await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch (e) { /* sigue con <img> */ } }
  return new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); }; im.src = u; });
}
function drawScaled(img, max) {
  const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight, k = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return c;
}
const canvasBlob = (c, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', q));

// Opciones de "a qué servicio pertenece la foto" según la cita(s) y los permisos.
function photoTargets(clientId, apptId) {

  const out = [];
  appts.forEach(a => {
    const lines = a.lines.filter(l => isAdmin() || l.pro === me()).sort((x, y) => x.start - y.start);

  });
  if (!apptId && isAdmin()) out.push({ v: '|', t: 'Sin cita (foto general)' });
  return out;
}

ON['ph-add'] = async el => {
  const box = el.closest('.ab-photos'), sel = $('[data-ph-target]', box);
  const files = Array.from(el.files || []).slice(0, 12); el.value = '';
  if (!files.length || !sel) return;
  const parts = sel.value.split('|'), apptId = parts[0], lineId = parts[1] || '';
  const a = apptId ? apptById(apptId) : null, line = a && lineId ? a.lines.find(l => l.id === lineId) : null;
  const label = line ? lineLabel(line) : (a ? a.lines.map(lineLabel).join(' + ') : 'Foto general');
  let ok = 0, bad = 0;
  toast('Procesando fotos…', { ms: 20000 });
  for (const f of files) {
    try {
      if (!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|heic|heif)$/i.test(f.name)) throw new Error('tipo');
      if (f.size > 30 * 1024 * 1024) throw new Error('tamaño');
      const img = await decodeImage(f);
      const full = drawScaled(img, 1600), thumb = drawScaled(img, 360);
      const blob = await canvasBlob(full, 0.82);
      const rec = { id: uid() + uid(), clientId: box.dataset.client, apptId, lineId, label, pro: line ? line.pro : '', date: a ? a.date : todayStr(), created: Date.now(), portfolio: false, w: full.width, h: full.height, thumb: thumb.toDataURL('image/jpeg', 0.72) };
      await PH.add(rec, blob); ok++;
      if (img.close) img.close();
    } catch (e) { bad++; }
  }
  refreshGalleries();
  if (a) { logH(a, `${ok} ${ok === 1 ? 'foto agregada' : 'fotos agregadas'}`); save(); }
  toast(ok ? `${ok} ${ok === 1 ? 'foto guardada' : 'fotos guardadas'}${bad ? ` · ${bad} no se pudo procesar` : ''}` : 'No se pudo procesar la imagen. Use una foto JPG o PNG.', { kind: ok ? '' : 'err' });
};

/* ---------- Cumpleaños ---------- */
const bdayPct = () => state.cfg.bdayPct == null ? 15 : state.cfg.bdayPct;
function birthdaysOfWeek(ws) {
  const days = weekDays(ws), out = [];
  state.clients.forEach(c => {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(c.bday || '')) return;
    const md = c.bday.slice(5);
    const d = days.find(x => x.slice(5) === md) || (md === '02-29' ? days.find(x => x.slice(5) === '02-28') : null);
    if (d) out.push({ c, date: d, age: +d.slice(0, 4) - +c.bday.slice(0, 4) });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date) || a.c.name.localeCompare(b.c.name, 'es'));
}

/* =====================================================================
   FINANZAS · cobros del mes (ingresos). Egresos y flujo de caja: módulo posterior.

function finRows(ym) {
  return state.appts.filter(a => monthOf(a.date) === ym).map(a => {
    const closed = a.status === 'cancelada' || a.status === 'no_asistio', done = a.status === 'realizada';
    const total = apptTotal(a), paid = paidOf(a), due = depositDue(a), income = closed ? paid : total;
    const depPend = closed || done ? 0 : Math.max(0, due - paid);
    const salPend = closed ? 0 : Math.max(0, total - paid - depPend);
    return { a, closed, done, total, paid, due, income, depPend, salPend, c: clientById(a.clientId) || { name: 'Sin nombre', phone: '' } };
  });
}
function finSummary(ym) {
  const rows = finRows(ym), open = rows.filter(r => !r.closed);
  const expected = rows.reduce((s, r) => s + r.income, 0);
  const pend = rows.reduce((s, r) => s + r.depPend + r.salPend, 0);
  const depRecv = open.filter(r => r.due > 0 && r.paid >= r.due);
  const depPendRows = rows.filter(r => r.depPend > 0), salPendRows = rows.filter(r => r.salPend > 0);
  const retained = rows.filter(r => r.closed && r.paid > 0);
  const owing = new Set(rows.filter(r => r.depPend + r.salPend > 0).map(r => r.a.clientId));
  return { rows, open, expected, pend, collected: expected - pend, depRecv, depRecvAmt: open.reduce((s, r) => s + Math.min(r.paid, r.due), 0),
    depPendRows, depPendAmt: depPendRows.reduce((s, r) => s + r.depPend, 0), salPendRows, salPendAmt: salPendRows.reduce((s, r) => s + r.salPend, 0),
    retained, retAmt: retained.reduce((s, r) => s + r.paid, 0), owing: owing.size };
}
function finByPro(F) {
  const by = {}; let extra = 0;
  F.open.forEach(r => { r.a.lines.forEach(l => { by[l.pro] = (by[l.pro] || 0) + num(l.price); }); extra += num(r.a.surcharge) + num(r.a.adjust); });
  const out = state.pros.filter(p => by[p.id]).map(p => ({ k: p.short, color: p.color, v: by[p.id] }));
  if (extra) out.push({ k: extra > 0 ? 'Recargos y ajustes' : 'Ajustes de paquetes', color: '#B7AEA6', v: extra });
  if (F.retAmt) out.push({ k: 'Anticipos retenidos', color: '#D9857A', v: F.retAmt });
  return out;
}
function finByWeek(F) {
  const w = {};
  F.rows.forEach(r => { const k = weekStart(r.a.date), o = w[k] = w[k] || { k, exp: 0, pend: 0 }; o.exp += r.income; o.pend += r.depPend + r.salPend; });
  return Object.keys(w).sort().map(k => w[k]);
}

        ${byPro.length ? byPro.map(r => `<div class="ab-toprow"><span><i class="ab-dot" style="background:${r.color}"></i> ${esc(r.k)}</span><div class="bar"><i style="width:${Math.max(3, Math.abs(r.v) * 100 / mxP)}%;background:${r.color}"></i></div><b>${money(r.v)}</b></div>`).join('') : '<p class="ab-muted">Sin datos este mes.</p>'}</section>
